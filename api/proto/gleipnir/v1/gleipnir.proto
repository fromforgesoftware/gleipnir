syntax = "proto3";

package gleipnir.v1;

import "google/protobuf/timestamp.proto";

// TokenService vends a connection's current provider secret to trusted backend
// callers (service-to-service). The caller passes the connection's owner; a
// mismatch yields not-found, never a secret. Refresh tokens never cross the
// wire — they stay sealed inside Gleipnir.
service TokenService {
  // Vend returns the connection's current secret, transparently refreshing it
  // when it is within the refresh lead of expiry.
  rpc Vend(VendRequest) returns (VendResponse);
}

// VendRequest identifies the connection to vend and the owner asserting access.
message VendRequest {
  // owner is the opaque owner key the trusted caller asserts.
  string owner = 1;
  // connection_id is the connection to vend a secret for.
  string connection_id = 2;
}

// VendResponse carries the secret material relevant to the connector's auth
// type. OAuth connectors populate access_token; API-key connectors populate
// api_key and api_secret.
message VendResponse {
  // access_token is the OAuth bearer token (empty for API-key connectors).
  string access_token = 1;
  // api_key is the API key (empty for OAuth connectors).
  string api_key = 2;
  // api_secret is the API secret (empty for OAuth connectors).
  string api_secret = 3;
  // expires_at is when the vended secret expires, if known.
  google.protobuf.Timestamp expires_at = 4;
  // fields carries the credential material that does not fit the two-string
  // API-key shape.
  //
  // Some venues need more than a key and a secret to open a session: Tradovate
  // wants an account login, an API key pair, a stable device id and an
  // application identifier, and a FIX session wants sender and target comp ids.
  // Packing those into api_secret as an encoded blob would put structure inside
  // a string that nothing validates, and adding a named field per venue would
  // make this message grow with the connector catalog.
  //
  // Gleipnir does not interpret these. It seals them, vends them back, and the
  // connector-specific adapter on the other side is what knows the names it
  // needs — which is also what keeps venue vocabulary out of the credential
  // store.
  map<string, string> fields = 5;
  // connector is the connector slug this connection belongs to — "tradovate",
  // "coinbase", "ibkr-flex".
  //
  // It is here because the caller needs it and asking separately would mean a
  // second round trip to learn something this response already knows. A trading
  // runner holding a connection id has to decide which venue adapter to build
  // before it can use the secret at all, and the alternative to being told is
  // guessing — either by trying adapters until one authenticates, or by keeping
  // its own copy of which connection is which, which is a second answer that can
  // disagree with this one.
  //
  // Not secret. It is returned on the S2S path only because that is where the
  // rest of this message goes.
  string connector = 6;
}

version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/fromforgesoftware/gleipnir/pkg/api
# The plugin versions are PINNED, and the pins are the point.
#
# Unpinned, `remote:` resolves to whatever the BSR publishes today, so the same protos generate
# different bytes on different days — and a drift check ("run buf generate, expect no diff") then fails
# on commits that never touched a .proto file. It reads as your change having broken codegen, when what
# actually happened is that a plugin was released.
#
# These are the versions the committed .pb.go files were generated by, taken from their own headers.
# Bumping one is a deliberate act: change it here, regenerate, and commit the result in that commit.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: pkg/api
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: pkg/api
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
inputs:
  - directory: api/proto
